<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2937">
<meta name="robots" content="noindex,nofollow">
<title>Your bookings</title>
<link rel="stylesheet" href="app.css">
<style>
body{padding-bottom:84px}
.top .out{margin-left:auto;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:.5rem}
.gate{max-width:380px;margin:0 auto;padding:2.4rem 16px}
.gate input{font-size:1.4rem;letter-spacing:.3em;text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tabs button{background:none;border:0;padding:.65rem 0 .7rem;font-weight:700;font-size:.8rem;color:var(--muted);cursor:pointer;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:1.25rem;line-height:1}
.tabs button.on{color:var(--link,var(--primary))}
@media (min-width:760px) and (max-width:899px){body{padding-bottom:0}.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);max-width:720px;margin:0 auto;grid-template-columns:repeat(4,auto);justify-content:start;gap:.4rem;padding:0 16px}
  .tabs button{flex-direction:row;min-height:48px;padding:0 .8rem;font-size:.95rem;border-bottom:3px solid transparent}.tabs button.on{border-bottom-color:var(--primary)}}
.view{padding:1.2rem 0 2rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{background:var(--card);border:0;padding:.55rem .9rem;font-weight:700;cursor:pointer;min-height:42px}
.seg button.on{background:var(--primary);color:var(--onp)}
.dayhead{font-family:var(--hfont);text-transform:var(--htrans);font-weight:800;margin:1.4rem 0 .5rem;font-size:1rem}
.dayhead small{font-family:var(--bfont);text-transform:none;font-weight:500;color:var(--muted);margin-left:.4rem}
.bk{border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:var(--radius);padding:.8rem .9rem;margin:0 0 .6rem;background:var(--card)}
.bk.cancelled{border-left-color:#bbb;opacity:.65}
.bk .when{font-weight:800;font-size:1.05rem}
.bk .svc{color:var(--muted);font-weight:600}
.bk .cust{margin:.35rem 0 0}
.bk .cust a{font-weight:600}
.bk .nt{background:var(--soft);border-radius:6px;padding:.4rem .6rem;margin:.5rem 0 0;font-size:.92rem}
.bk .acts{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:.1rem .5rem;background:var(--soft);color:#4b5563;margin-left:.3rem;vertical-align:2px}
.dark-ui .tag{color:var(--text)}.tag.x{background:#fee2e2;color:var(--bad)}.tag.who{background:var(--primary);color:var(--onp)}
.bk.req{border-left-color:#d97706;background:#fffbeb}.tag.w{background:#fde68a;color:#78350f}
html.dark-ui .bk.req{background:rgba(217,119,6,.12)}
.bk .ans{margin:.45rem 0 0;font-size:.92rem}.bk .ans div{margin:.1rem 0}.bk .ans span{color:var(--muted)}
.waiting{background:#fffbeb;border:1px solid #fcd34d;color:#78350f;border-radius:var(--radius);padding:.7rem .9rem;margin:0 0 1rem;font-weight:600}
html.dark-ui .waiting{background:rgba(217,119,6,.12);color:inherit}
.inline{background:var(--soft);border-radius:var(--radius);padding:.8rem;margin-top:.6rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.svcrow{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;align-items:end;border-bottom:1px solid var(--line);padding:.7rem 0}
.svcrow label.f:first-child{grid-column:1/-1}
@media (min-width:600px){.svcrow{grid-template-columns:1fr 100px 110px}.svcrow label.f:first-child{grid-column:auto}}
.svcrow .full{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.svcrow label.f{margin:0}
.hrs{display:grid;grid-template-columns:110px 1fr;gap:.4rem .8rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)}
.hrs .times{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.hrs .rng{display:flex;align-items:center;gap:.4rem;white-space:nowrap;width:100%;max-width:19rem}
.hrs input[type=time]{flex:1 1 0;width:auto;min-width:0;padding:.55rem .45rem}
.sec{margin:0 0 2rem}
.sec > h2{margin-bottom:.8rem}
.link{display:flex;gap:.5rem}.link input{flex:1;font-size:.9rem}
.empty{color:var(--muted);padding:1rem 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111;color:#fff;padding:.7rem 1rem;border-radius:10px;z-index:50;font-weight:600;max-width:92vw}
@media (min-width:760px){.toast{bottom:24px}}
/* computers: menu down the left, bookings in columns, settings side by side */
@media (min-width:900px){
  body{padding-bottom:0}
  .top .wrap{max-width:1180px}
  .shell{max-width:1180px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:2.5rem;align-items:start}
  .shell > .wrap{max-width:none;padding:0;margin:0;width:100%}
  .tabs{position:sticky;top:16px;left:auto;right:auto;bottom:auto;display:flex;flex-direction:column;gap:.25rem;border:0;background:none;padding:1.4rem 0 0}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:.7rem;min-height:46px;padding:0 .9rem;border-radius:var(--radius);font-size:.95rem;color:var(--text)}
  .tabs button span{font-size:1.1rem;width:1.4rem;text-align:center}
  .tabs button.on{background:var(--soft);color:var(--primary)}
  .daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.8rem}
  .daygrid .bk{margin:0}
  .setgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 3rem;align-items:start}
  .setgrid .wide{grid-column:1/-1}
  #addf,#offf{max-width:680px}
  .gate{padding-top:4rem}
}
@media (max-width:420px){.hrs{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top hidden" id="top"><div class="wrap"><img id="logo" alt="" class="hidden"><div class="who"><b id="bname"></b><span>Your bookings</span></div><button class="out hidden" id="signout" type="button">Sign out</button></div></header>
<div class="shell">
<nav class="tabs hidden" id="tabs">
  <button type="button" data-tab="diary" class="on"><span>📅</span>Diary</button>
  <button type="button" data-tab="add"><span>＋</span>Add</button>
  <button type="button" data-tab="off"><span>🌴</span>Time off</button>
  <button type="button" data-tab="setup"><span>⚙︎</span>Settings</button>
</nav>
<main class="wrap" id="main"><p class="empty">Loading…</p></main>
</div>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  "use strict";
  var E = BWAPI.esc, $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var slug = BWAPI.slug(), q = new URLSearchParams(location.search);
  var KEY = "bw-owner-" + slug, token = "", D = null, tab = "diary", diaryMode = "up", showCancelled = false, whoFilter = "";
  var DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"], DAYN = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
  var MN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  BWAPI.testBanner();
  try { token = localStorage.getItem(KEY) || ""; } catch (e) {}

  function ms(d) { var p = d.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function add(d, n) { return new Date(ms(d) + n * 864e5).toISOString().slice(0, 10); }
  function hm(m) { return (m < 600 ? "0" : "") + Math.floor(m / 60) + ":" + ((m % 60) < 10 ? "0" : "") + (m % 60); }
  function niceTime(min) { var h = Math.floor(min / 60), m = min % 60; if (h === 12 && !m) return "12 noon"; return ((h % 12) || 12) + (m ? ":" + (m < 10 ? "0" : "") + m : "") + (h >= 12 ? "pm" : "am"); }
  function niceDate(d) { var x = new Date(ms(d)); return ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][x.getUTCDay()] + " " + x.getUTCDate() + " " + MN[x.getUTCMonth()]; }
  function len(min) { var h = Math.floor(min / 60), m = min % 60; return (h ? h + (h === 1 ? " hr" : " hrs") : "") + (h && m ? " " : "") + (m ? m + " mins" : ""); }
  function tel(p) { return String(p || "").replace(/[^\d+]/g, ""); }
  function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function saveToken(t) { token = t; try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }
  function bookUrl() { if (BWAPI.demo) return location.href.replace(/[?#].*$/, "").replace(/admin\.html$/, "");
    return location.href.replace(/[?#].*$/, "").replace(/admin\.html$/, "").replace(/[^/]*$/, "") + (location.pathname.indexOf("/book/" + slug + "/") >= 0 ? "" : "?b=" + encodeURIComponent(slug)); }

  if (!slug) { $("#main").innerHTML = '<div class="gate"><h1>Link not complete</h1><p>Please use the link Jay sent you.</p></div>'; return; }

  function call(action, p) {
    return BWAPI.call(action, Object.assign({ b: slug, token: token }, p || {})).then(function (r) {
      if (!r.ok && r.signin) { saveToken(""); gate(r.error); }
      return r;
    });
  }

  // ---------------------------------------------------------------- sign in / first-time PIN
  BWAPI.call("config", { b: slug }).then(function (r) {
    if (!r.ok) { $("#main").innerHTML = '<div class="gate"><h1>Not found</h1><p>' + E(r.error) + "</p></div>"; return; }
    BWAPI.applyTheme(r.business.theme);
    $("#bname").textContent = r.business.name;
    document.title = "Bookings | " + r.business.name;
    if (r.business.theme.logo) { $("#logo").src = r.business.theme.logo; $("#logo").alt = ""; $("#logo").classList.remove("hidden"); }
    $("#top").classList.remove("hidden");
    if (BWAPI.demo) return BWAPI.ready.then(function () { saveToken(BWLocal.demoSignIn()); load(); });
    if (q.get("setup")) return setupView(q.get("setup"));
    if (token) return load(); else gate();
  });

  function gate(msg) {
    $("#tabs").classList.add("hidden"); $("#signout").classList.add("hidden");
    $("#main").innerHTML = '<form class="gate" id="gate"><h1>Sign in</h1><p class="muted">Enter your PIN to see your bookings.</p>' + (msg ? '<div class="err">' + E(msg) + "</div>" : "") +
      '<label class="f"><span>PIN</span><input type="password" inputmode="numeric" autocomplete="current-password" name="pin" maxlength="10" required></label><div id="gerr"></div>' +
      '<button class="btn wide" type="submit">Sign in</button><p class="small muted" style="margin-top:1.2rem">Forgotten your PIN? Ask Jay at Builds by Walden for a new set-up link.</p></form>';
    $("#gate [name=pin]").focus();
    $("#gate").onsubmit = function (e) {
      e.preventDefault();
      var b = $("#gate button"); b.disabled = true;
      BWAPI.call("login", { b: slug, pin: e.target.pin.value }).then(function (r) {
        b.disabled = false;
        if (!r.ok) { $("#gerr").innerHTML = '<div class="err">' + E(r.error) + "</div>"; return; }
        saveToken(r.token); load();
      });
    };
  }

  function setupView(code) {
    $("#main").innerHTML = '<form class="gate" id="su"><h1>Welcome</h1><p>This is where you\'ll manage your online bookings. First, choose a PIN (6 to 10 numbers). You\'ll use it to sign in on your phone or computer.</p>' +
      '<label class="f"><span>Choose a PIN</span><input type="password" inputmode="numeric" autocomplete="new-password" name="pin" maxlength="10" required></label>' +
      '<label class="f"><span>Type it again</span><input type="password" inputmode="numeric" autocomplete="new-password" name="pin2" maxlength="10" required></label><div id="serr"></div>' +
      '<button class="btn wide" type="submit">Save my PIN</button></form>';
    $("#su").onsubmit = function (e) {
      e.preventDefault();
      var f = e.target;
      if (f.pin.value !== f.pin2.value) { $("#serr").innerHTML = '<div class="err">The two PINs don\'t match.</div>'; return; }
      BWAPI.call("setup", { b: slug, code: code, pin: f.pin.value }).then(function (r) {
        if (!r.ok) { $("#serr").innerHTML = '<div class="err">' + E(r.error) + "</div>"; return; }
        saveToken(r.token);
        history.replaceState(null, "", location.pathname + (q.get("b") ? "?b=" + encodeURIComponent(slug) + (BWAPI.local && q.get("local") ? "&local=1" : "") : ""));
        tab = "setup"; load(); toast("PIN saved. Check your services and hours below.");
      });
    };
  }

  $("#signout").onclick = function () { saveToken(""); gate(); };

  // ---------------------------------------------------------------- the app
  function load() {
    var from = diaryMode === "past" ? add(todayGuess(), -60) : "";
    return call("admin", from ? { from: from, to: add(todayGuess(), 0) } : {}).then(function (r) {
      if (!r.ok) { if (!r.signin) $("#main").innerHTML = '<div class="err">' + E(r.error) + "</div>"; return; }
      D = r;
      $("#tabs").classList.remove("hidden"); if (!BWAPI.demo) $("#signout").classList.remove("hidden");
      // restaurants and cafés don't need a Time off tab (Jay, 10 Oct 2026)
      $('#tabs [data-tab="off"]').classList.toggle("hidden", isT()); $("#tabs").classList.toggle("three", isT());
      if (isT() && tab === "off") tab = "diary";
      show(tab);
    });
  }
  function todayGuess() { return D ? D.today : new Date().toISOString().slice(0, 10); }

  $$("#tabs button").forEach(function (b) { b.onclick = function () { show(b.dataset.tab); window.scrollTo(0, 0); }; });
  function show(t) {
    tab = t;
    $$("#tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === t); });
    ({ diary: diary, add: addView, off: offView, setup: setupPage })[t]();
  }

  /* the team (driving instructors, stylists): each has their own diary */
  function team() { return isT() ? [] : (D.business.staff || []).filter(function (s) { return s.active !== false; }); }
  function staffSelect(name, sel, blank) {
    var t = team(); if (!t.length) return "";
    return '<label class="f"><span>With</span><select name="' + name + '">' + (blank ? '<option value="">' + E(blank) + "</option>" : "") +
      t.map(function (s) { return '<option value="' + E(s.id) + '"' + (s.id === sel ? " selected" : "") + ">" + E(s.name) + "</option>"; }).join("") + "</select></label>";
  }
  function svcOptions(sel) {
    return D.business.services.map(function (s) { return '<option value="' + E(s.id) + '"' + (s.id === sel ? " selected" : "") + ">" + E(s.name) + " (" + len(s.minutes) + ")" + (s.active ? "" : " - hidden") + "</option>"; }).join("");
  }

  // diary
  function diary() {
    var today = D.today, list = D.bookings.filter(function (x) {
      if (!showCancelled && x.status !== "confirmed" && x.status !== "requested") return false;
      if (whoFilter && x.staff && x.staff !== whoFilter) return false;
      return diaryMode === "past" ? (x.date < today || (x.date === today && x.start + x.minutes <= D.now)) : (x.date > today || (x.date === today && x.start + x.minutes > D.now));
    });
    if (diaryMode === "past") list.reverse();
    var h = '<div class="view"><div class="bar"><div class="seg"><button type="button" data-m="up" class="' + (diaryMode === "up" ? "on" : "") + '">Coming up</button><button type="button" data-m="past" class="' + (diaryMode === "past" ? "on" : "") + '">Past</button></div>' +
      '<label class="check" style="margin:0"><input type="checkbox" id="showx"' + (showCancelled ? " checked" : "") + "> Show cancelled</label>" +
      (team().length > 1 ? '<label class="f" style="margin:0"><select id="whof" aria-label="Whose bookings"><option value="">Everyone</option>' + team().map(function (s) { return '<option value="' + E(s.id) + '"' + (whoFilter === s.id ? " selected" : "") + ">" + E(s.name) + "</option>"; }).join("") + "</select></label>" : "") + "</div>";
    var waiting = D.bookings.filter(function (x) { return x.status === "requested" && (x.date > today || (x.date === today && x.start > D.now)); }).length;
    if (waiting && diaryMode === "up") h += '<div class="waiting">' + waiting + (waiting === 1 ? " request is" : " requests are") + " waiting for you to accept or decline.</div>";
    if (D.business.status !== "active") h += '<div class="err">Online booking is switched off, so customers can\'t book. Turn it back on in Settings.</div>';
    if (!list.length) h += '<p class="empty">' + (diaryMode === "past" ? "No bookings in the last two months." : "No bookings coming up yet. Share your booking link (in Settings) so customers can book.") + "</p>";
    var last = "";
    list.forEach(function (x) {
      if (x.date !== last) {
        if (last) h += "</div>";
        last = x.date;
        var n = list.filter(function (y) { return y.date === x.date && (y.status === "confirmed" || y.status === "requested"); }).length;
        var ppl = isT() ? list.filter(function (y) { return y.date === x.date && (y.status === "confirmed" || y.status === "requested"); }).reduce(function (a, y) { return a + (+y.party || 0); }, 0) : 0;
        h += '<div class="dayhead">' + (x.date === today ? "Today" : x.date === add(today, 1) ? "Tomorrow" : niceDate(x.date)) + "<small>" + (x.date === today || x.date === add(today, 1) ? niceDate(x.date) + " · " : "") + n + (n === 1 ? " booking" : " bookings") + (ppl ? ", " + ppl + " people" : "") + '</small></div><div class="daygrid">';
      }
      h += card(x);
    });
    if (last) h += "</div>";
    $("#main").innerHTML = h + "</div>";
    $$("[data-m]").forEach(function (b) { b.onclick = function () { diaryMode = b.dataset.m; load(); }; });
    $("#showx").onchange = function () { showCancelled = this.checked; diary(); };
    if ($("#whof")) $("#whof").onchange = function () { whoFilter = this.value; diary(); };
    $$("[data-move]").forEach(function (b) { b.onclick = function () { moveForm(b.dataset.move); }; });
    $$("[data-cancel]").forEach(function (b) { b.onclick = function () { cancelForm(b.dataset.cancel); }; });
    $$("[data-accept]").forEach(function (b) {
      b.onclick = function () {
        var sel = $("#bk-" + b.dataset.accept + " [name=to]"), to = sel ? sel.value : "";
        b.disabled = true;
        call("accept", { id: b.dataset.accept, staff: to }).then(function (r) {
          if (!r.ok) { b.disabled = false; toast(r.error); return; }
          if (r.clash) { b.disabled = false; toast(r.clash.join("; ") + ". Choose someone else, or move it."); return; }
          toast("Accepted" + (r.count > 1 ? " (all " + r.count + " weeks)" : "") + (r.emailed ? ". We've emailed " + r.booking.name.split(" ")[0] + " to confirm." : ".")); load();
        });
      };
    });
    $$("[data-decline]").forEach(function (b) { b.onclick = function () { declineForm(b.dataset.decline); }; });
  }
  function declineForm(id) {
    var x = find(id), el = $("#bk-" + id + " .slot");
    el.innerHTML = '<form class="inline"><p style="margin:0 0 .5rem"><b>Decline ' + E(x.name) + "'s request?</b> The time becomes free again.</p>" +
      '<label class="f"><span>Message for them <small class="muted">(optional, goes in the email)</small></span><input type="text" name="reply" maxlength="300" placeholder="e.g. I\'m fully booked that week, could you try the week after?"></label>' +
      '<div class="msg"></div><div class="acts"><button class="btn small danger" type="submit">Decline</button><button class="btn line small" type="button" data-close>Keep it</button></div></form>';
    var f = $("form", el);
    $("[data-close]", el).onclick = function () { el.innerHTML = ""; };
    f.onsubmit = function (e) {
      e.preventDefault();
      call("decline", { id: id, reply: f.reply.value }).then(function (r) {
        if (!r.ok) { $(".msg", f).innerHTML = '<div class="err">' + E(r.error) + "</div>"; return; }
        toast("Declined" + (r.emailed ? ". We've emailed them." : ".")); load();
      });
    };
  }

  function card(x) {
    var req = x.status === "requested", live = x.status === "confirmed" || req;
    return '<div class="bk' + (live ? "" : " cancelled") + (req ? " req" : "") + '" id="bk-' + E(x.id) + '"><div class="when">' + niceTime(x.start) + " – " + niceTime(x.start + x.minutes) +
      (live ? "" : '<span class="tag x">' + (x.status === "declined" ? "Declined" : "Cancelled") + "</span>") + (req ? '<span class="tag w">Waiting for you</span>' : "") + (x.staff_name ? '<span class="tag who">' + E(x.staff_name) + "</span>" : "") + (x.series ? '<span class="tag">Weekly</span>' : "") +
      '<span class="tag">' + (x.source === "owner" ? "Added by you" : req ? "Requested online" : "Booked online") + "</span></div>" +
      '<div class="svc">' + (x.party ? "Table for " + E(x.party) : E(x.service) + " · " + len(x.minutes)) + "</div>" +
      '<div class="cust"><b>' + E(x.name) + "</b>" + (x.phone ? ' · <a href="tel:' + E(tel(x.phone)) + '">' + E(x.phone) + "</a>" : "") + (x.email ? '<br><a href="mailto:' + E(x.email) + '">' + E(x.email) + "</a>" : "") + "</div>" +
      ((x.answers || []).length ? '<div class="ans">' + x.answers.map(function (a) { return "<div><span>" + E(a.q) + ":</span> " + E(a.a) + "</div>"; }).join("") + "</div>" : "") +
      (x.note ? '<div class="nt">' + E(x.note) + "</div>" : "") +
      (req && diaryMode === "up" ? '<div class="acts">' + (team().length > 1 ? '<select name="to" aria-label="Who it is with" class="small">' + team().map(function (s) { return '<option value="' + E(s.id) + '"' + (s.id === x.staff ? " selected" : "") + ">" + E(s.name) + "</option>"; }).join("") + "</select>" : "") + '<button type="button" class="btn small" data-accept="' + E(x.id) + '">Accept' + (x.series ? " all weeks" : "") + "</button>" + '<button type="button" class="btn line small" data-decline="' + E(x.id) + '">Decline</button></div><div class="slot"></div>' : "") +

      e.preventDefault(); var f = e.target;
      var st = { step: +f.step.value, buffer: +f.buffer.value, notice_hours: +f.notice_hours.value, days_ahead: +f.days_ahead.value, cancel_hours: +f.cancel_hours.value, note: f.note.value };
      if (f.seats) { st.seats = +f.seats.value; st.max_party = +f.max_party.value; }
      if (f.approve) st.approve = f.approve.checked;
      if (f.repeat_max) st.repeat_max = +f.repeat_max.value;
      save({ settings: st }, "#rmsg", "Rules saved.");
    };
    $("#me").onsubmit = function (e) {
      e.preventDefault(); var f = e.target;
      save({ owner_email: f.owner_email.value, phone: f.phone.value, address: f.address.value, settings: { notify_owner: f.notify_owner.checked } }, "#mmsg", "Saved.");
    };
    $("#pinf").onsubmit = function (e) {
      e.preventDefault(); var f = e.target;
      call("pin_change", { old: f.old.value, pin: f.pin.value }).then(function (r) {
        if (!r.ok) { $("#pmsg").innerHTML = '<div class="err">' + E(r.error) + "</div>"; return; }
        saveToken(r.token); f.reset(); toast("PIN changed.");
      });
    };
  }
  function opts(list, val) {
    var has = list.some(function (o) { return +o[0] === +val; });
    if (!has) list = list.concat([[val, val + ""]]);
    return list.map(function (o) { return '<option value="' + o[0] + '"' + (+o[0] === +val ? " selected" : "") + ">" + E(o[1]) + "</option>"; }).join("");
  }
  function save(patch, msgEl, okMsg) {
    return call("save", { patch: patch }).then(function (r) {
      if (!r.ok) { if (msgEl) $(msgEl).innerHTML = '<div class="err">' + E(r.error) + "</div>"; else toast(r.error); return; }
      D.business = r.business;
      if (msgEl) $(msgEl).innerHTML = "";
      toast(okMsg || "Saved.");
      if (patch.services || patch.staff) setupPage();
    });
  }
})();
</script>
</body>
</html>
