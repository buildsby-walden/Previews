<!doctype html>
<html lang="en-GB">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2937">
<title>Book online</title>
<link rel="stylesheet" href="app.css">
<style>
.intro{padding:1.6rem 0 .4rem}
.note{background:var(--soft);border-radius:var(--radius);padding:.7rem .9rem;margin:.6rem 0 0;font-size:.95rem}
.step{padding:1.2rem 0;border-bottom:1px solid var(--line)}
.step h2{display:flex;align-items:center;gap:.6rem}
.step h2 i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--onp);font-size:.85rem;flex:none}
.step.done h2 i{background:var(--text)}
.step .chosen{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--muted)}
.step .chosen button{background:none;border:0;color:var(--link,var(--primary));font-weight:700;cursor:pointer;text-decoration:underline;padding:.4rem}
.services{display:grid;gap:.6rem}
.svc{display:flex;justify-content:space-between;align-items:center;gap:1rem;text-align:left;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--card);padding:.9rem 1rem;cursor:pointer;min-height:60px}
.svc:hover{border-color:var(--primary)}
.svc b{display:block;font-family:var(--hfont)}
.svc small{color:var(--muted)}
.svc .price{font-weight:800;white-space:nowrap}
.parties{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.6rem}
.party{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--card);padding:.6rem 0;cursor:pointer;min-height:60px;line-height:1.1}
.party b{display:block;font-size:1.3rem;font-family:var(--hfont)}.party small{color:var(--muted);font-size:.75rem}
.party:hover{border-color:var(--primary)}
.week{display:flex;align-items:center;gap:.4rem;margin:.4rem 0 .8rem}
.week button.nav{flex:none;width:40px;height:56px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;font-size:1.2rem}
.week button.nav:disabled{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem;flex:1;min-width:0}
.day{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--card);padding:.35rem 0;cursor:pointer;text-align:center;line-height:1.15;min-height:56px}
.day small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day b{font-size:1.05rem}
.day.none{opacity:.38;cursor:default}
.day.on{background:var(--primary);border-color:var(--primary);color:var(--onp)}.day.on small{color:var(--onp)}
.month{font-weight:700;margin:0 0 .2rem}
.who{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 .9rem}.who-q{font-weight:700;margin:.2rem 0 .5rem}
.who button{border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:.55rem 1rem;min-height:44px;font-weight:700;cursor:pointer}
.who button.on{background:var(--primary);border-color:var(--primary);color:var(--onp)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.45rem}
.time{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--card);padding:.7rem 0;cursor:pointer;font-weight:700;min-height:48px}
.time:hover{border-color:var(--primary)}
.summary{background:var(--soft);border-radius:var(--radius);padding:.9rem 1rem;margin:0 0 1rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done-box{text-align:center;padding:2.2rem 0}
.done-box .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 1rem;font-size:2rem}
.done-box .summary{text-align:left;max-width:420px;margin:1rem auto}
.loading{padding:3rem 0;text-align:center;color:var(--muted)}
@media (max-width:420px){.week button.nav{width:32px}.day b{font-size:.95rem}}
/* computers: wider, with a 'Your booking' summary down the side */
.side{display:none}
.sumcard{border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem;background:var(--card)}
.sumcard h2{font-size:1rem;margin-bottom:.8rem}
.sumcard dl{margin:0;display:grid;gap:.7rem}.sumcard dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sumcard dd{margin:.1rem 0 0;font-weight:600}.sumcard dd.no{color:var(--muted);font-weight:500}
.sumcard .help{border-top:1px solid var(--line);margin-top:1rem;padding-top:.9rem;font-size:.9rem;color:var(--muted)}
@media (min-width:900px){
  .wrap{max-width:1080px}
  .top .wrap{padding-top:18px;padding-bottom:18px}
  .intro{padding-top:2.4rem}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:3rem;align-items:start}
  .side{display:block;position:sticky;top:20px;padding-top:1.2rem}
  .services{grid-template-columns:1fr 1fr}
  .times{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
}
</style>
</head>
<body>
<header class="top hidden" id="top"><div class="wrap"><img id="logo" alt="" class="hidden"><div class="who"><b id="bname"></b><span id="bwhere"></span></div></div></header>
<main class="wrap" id="main"><p class="loading">Loading…</p></main>
<footer class="foot"><div class="wrap">Online booking by Builds by Walden · <a href="privacy.html">Privacy</a></div></footer>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  "use strict";
  var E = BWAPI.esc, $ = function (s) { return document.querySelector(s); };
  var slug = BWAPI.slug(), params = new URLSearchParams(location.search);
  var biz = null, W = null, pick = { service: null, date: null, start: null, staff: "any" }, week = null, lastDay = null, todayUK = null, busy = false, pendingGo = null;
  var DN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  BWAPI.testBanner();

  function ms(d) { var p = d.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function add(d, n) { var x = new Date(ms(d) + n * 864e5); return x.toISOString().slice(0, 10); }
  function wd(d) { return new Date(ms(d)).getUTCDay(); }
  function niceTime(min) { var h = Math.floor(min / 60), m = min % 60; if (h === 12 && !m) return "12 noon"; return ((h % 12) || 12) + (m ? ":" + (m < 10 ? "0" : "") + m : "") + (h >= 12 ? "pm" : "am"); }
  function niceDate(d) { var x = new Date(ms(d)); return ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][x.getUTCDay()] + " " + x.getUTCDate() + " " + MN[x.getUTCMonth()]; }
  function len(min) { var h = Math.floor(min / 60), m = min % 60; return (h ? h + (h === 1 ? " hr" : " hrs") : "") + (h && m ? " " : "") + (m ? m + " mins" : ""); }
  function price(p) { p = String(p || "").trim(); return !p ? "" : /^[\d.]+$/.test(p) ? "£" + p : p; }
  function fail(msg) { $("#main").innerHTML = '<div class="intro"><h1>Sorry</h1><p>' + E(msg) + "</p></div>"; }

  if (!slug) return fail("This booking link isn't complete. Please check the link you were sent.");

  BWAPI.call("config", { b: slug }).then(function (r) {
    if (!r.ok) return fail(r.error);
    biz = r.business; W = biz.words || { title: "Book online", pick: "Choose what you'd like", note_q: "Anything we should know?" };
    BWAPI.applyTheme(biz.theme);
    document.title = "Book online | " + biz.name;
    $("#bname").textContent = biz.name;
    $("#bwhere").innerHTML = [biz.address ? E(biz.address) : "", biz.phone ? '<a href="tel:' + E(biz.phone.replace(/[^\d+]/g, "")) + '">' + E(biz.phone) + "</a>" : ""].filter(Boolean).join(" · ");
    if (biz.theme.logo) { $("#logo").src = biz.theme.logo; $("#logo").alt = biz.name; $("#logo").classList.remove("hidden"); }
    $("#top").classList.remove("hidden");
    if (params.get("cancel")) return cancelView(params.get("cancel"), params.get("t"));
    if (!biz.open) return fail("Online booking is switched off at the moment." + (biz.phone ? " Please call " + biz.phone + "." : ""));
    render();
  });

  function render() {
    var s = pick.service, h = "";
    h += '<div class="intro"><h1>' + E(W.title) + '</h1>' + (biz.menu_url ? '<p><a href="' + E(biz.menu_url) + '" target="_blank" rel="noopener">See the menu</a></p>' : "") +
      (biz.settings.note ? '<p class="note">' + E(biz.settings.note) + "</p>" : "") + "</div>";
    h += '<div class="layout"><div class="steps">';
    // 1 service (a restaurant: how many people)
    h += '<section id="step1" class="step' + (s ? " done" : "") + '"><h2><i>1</i>' + E(W.pick) + "</h2>";
    if (s) h += '<div class="chosen"><span>' + whatLine() + '</span><button type="button" data-go="service">Change</button></div>';
    else if (isT()) h += '<div class="parties">' + Array.apply(null, Array(biz.settings.max_party || 8)).map(function (_, i) {
      return '<button type="button" class="party" data-party="' + (i + 1) + '"><b>' + (i + 1) + "</b><small>" + (i ? "people" : "person") + "</small></button>";
    }).join("") + "</div>" + '<p class="small muted">More than ' + (biz.settings.max_party || 8) + "?" + (biz.phone ? ' Please call <a href="tel:' + E(biz.phone.replace(/[^\d+]/g, "")) + '">' + E(biz.phone) + "</a>." : " Please get in touch.") + "</p>";
    else h += '<div class="services">' + biz.services.map(function (x, i) {
      return '<button type="button" class="svc" data-svc="' + i + '"><span><b>' + E(x.name) + "</b><small>" + len(x.minutes) + (x.desc ? " · " + E(x.desc) : "") + '</small></span><span class="price">' + E(price(x.price)) + "</span></button>";
    }).join("") + "</div>";
    h += "</section>";
    // 2 time
    h += '<section id="step2" class="step' + (pick.start != null ? " done" : "") + '"><h2><i>2</i>Choose a day and time</h2>';
    if (!s) h += '<p class="muted">Pick from the list above first.</p>';
    else if (pick.start != null) h += '<div class="chosen"><span><b>' + niceDate(pick.date) + " at " + niceTime(pick.start) + '</b></span><button type="button" data-go="time">Change</button></div>';
    else h += staffChoice() + '<div id="picker"><p class="muted">Finding free times…</p></div>';
    h += "</section>";
    // 3 details
    h += '<section id="step3" class="step"><h2><i>3</i>Your details</h2>';
    if (pick.start == null) h += '<p class="muted">Then add your name and number.</p>';
    else h += '<form id="form" novalidate>' +
      '<div class="summary">' + whatLine() + "<br>" + niceDate(pick.date) + " at " + niceTime(pick.start) + (isT() ? "" : " (" + len(s.minutes) + ")") + "</div>" +
      '<label class="f"><span>Your name</span><input type="text" name="name" autocomplete="name" required maxlength="80"></label>' +
      '<div class="pair"><label class="f"><span>Mobile number</span><input type="tel" name="phone" autocomplete="tel" required maxlength="30"></label>' +
      '<label class="f"><span>Email</span><input type="email" name="email" autocomplete="email" required maxlength="120"><small class="muted">Your confirmation goes here.</small></label></div>' +
      repeatChoice() + questions() +
      '<label class="f"><span>' + E(W.note_q) + ' <small class="muted">(optional)</small></span><textarea name="note" maxlength="500" placeholder="' + E(W.note_hint || "") + '"></textarea></label>' +
      '<label class="hp" aria-hidden="true">Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>' +
      '<p class="small muted">Your details go to ' + E(biz.name) + ' so they can look after your booking. <a href="privacy.html" target="_blank">How they\'re used</a>.</p>' +
      (ask() ? '<p class="small muted">This is a request: ' + E(biz.name) + " will check it and email you to confirm.</p>" : "") +
      '<div id="ferr"></div><button class="btn wide" type="submit">' + (ask() ? "Send request" : "Confirm booking") + "</button></form>";
    h += "</section>";
    h += '</div><aside class="side">' + summary() + "</aside></div>";
    $("#main").innerHTML = h;
    document.querySelectorAll("[data-party]").forEach(function (b) {
      b.onclick = function () { pick = { service: biz.services[0], party: +b.dataset.party, date: null, start: null }; week = null; pendingGo = "#step2"; render(); };
    });
    document.querySelectorAll("[data-svc]").forEach(function (b) { b.onclick = function () { pick = { service: biz.services[+b.dataset.svc], date: null, start: null, staff: pick.staff || "any" }; week = null; pendingGo = "#step2"; render(); }; });
    document.querySelectorAll("[data-staff]").forEach(function (b) { b.onclick = function () { pick.staff = b.dataset.staff; pick.date = null; week = null; render(); }; });
    document.querySelectorAll("[data-go]").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.go === "service") { pick = { service: null, date: null, start: null, staff: pick.staff || "any" }; } else { pick.start = null; }
        if (b.dataset.go === "service") { render(); goTo("#step1"); } else { pendingGo = "#step2"; render(); }
      };
    });
    if (s && pick.start == null) loadWeek(week);
    if ($("#form")) { $("#form").onsubmit = submit; typeAt("#form [name=name]"); }
  }

  /* after each choice, gently bring the next step into view: only as far as needed to see it clearly, and not at all if
     it's already on screen (Jay, 10 Oct 2026). Only this page's own window scrolls, so the demo inside a presentation's
     frame never moves the presentation itself. */
  function glide(y) {
    var start = window.pageYOffset || 0, dist = y - start;
    if (Math.abs(dist) < 4) return;
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { window.scrollTo({ top: y, behavior: "instant" }); return; }
    var t0 = null, dur = Math.min(900, 450 + Math.abs(dist) * 0.6);
    var ease = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
    requestAnimationFrame(function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      window.scrollTo({ top: start + dist * ease(p), behavior: "instant" });
      if (p < 1) requestAnimationFrame(step);
    });
  }
  function goTo(sel) {
    var el = typeof sel === "string" ? $(sel) : sel;
    if (!el) return;
    var r = el.getBoundingClientRect(), vh = window.innerHeight, show = Math.min(r.height, vh * 0.45);
    if (r.top < 12) { glide((window.pageYOffset || 0) + r.top - 20); return; }   // it's above the screen (the page got shorter): back up to it
    var need = r.top + show - (vh - 24);          // how far until enough of it is on screen
    if (need <= 0) return;
    need = Math.min(need, r.top - 12);             // never past its own heading
    if (need > 0) glide((window.pageYOffset || 0) + need);
  }
  function showTimes() {     // a new day's times: make sure they're on screen
    var t = $("#picker .times");
    if (t) goTo(t);
  }
  function typeAt(sel) {     // put the cursor in the box on computers; on phones that would pop the keyboard up over everything
    var n = $(sel);
    if (n && !("ontouchstart" in window)) { try { n.focus({ preventScroll: true }); } catch (e) {} }
  }

  function isT() { return biz.mode === "tables"; }
  function team() { return isT() ? [] : (biz.staff || []); }
  function staffName(id) { var p = team().filter(function (x) { return x.id === id; })[0]; return p ? p.name : ""; }
  /* who it's with: a business with a team (driving instructors) lets customers choose, or take whoever is free */
  function staffChoice() {
    if (team().length < 2 || biz.settings.pick_staff === false) return "";
    return '<p class="who-q">' + E(W.staff_q || "Who would you like?") + '</p><div class="who" role="group">' +
      [["any", W.staff_any || "Anyone available"]].concat(team().map(function (p) { return [p.id, p.name]; })).map(function (o) {
        return '<button type="button" data-staff="' + E(o[0]) + '" aria-pressed="' + (pick.staff === o[0]) + '" class="' + (pick.staff === o[0] ? "on" : "") + '">' + E(o[1]) + "</button>";
      }).join("") + "</div>" + (biz.staff_note ? '<p class="small muted" style="margin:-.4rem 0 .8rem">' + E(biz.staff_note) + "</p>" : "");
  }
  /* the same time every week, for as many weeks as the business allows */
  function repeatChoice() {
    var n = +(biz.settings.repeat_max || 0);
    if (isT() || n < 2) return "";
    var o = '<option value="1">Just this once</option>';
    for (var i = 2; i <= n; i++) o += '<option value="' + i + '">Same time every week, for ' + i + " weeks</option>";
    return '<label class="f"><span>How often?</span><select name="repeat">' + o + "</select></label>";
  }
  function ask() { return !!(biz.settings && biz.settings.approve); }   // bookings are requests the business accepts
  /* the trade's own questions (pickup address, the dog's name and size...), set up for this business */
  function questions() {
    return (biz.questions || []).map(function (q) {
      var lab = '<span>' + E(q.label) + (q.required ? "" : ' <small class="muted">(optional)</small>') + "</span>";
      if (q.kind === "choice") return '<label class="f">' + lab + '<select name="q_' + E(q.id) + '"' + (q.required ? " required" : "") + '><option value="">Choose…</option>' +
        q.options.map(function (o) { return "<option>" + E(o) + "</option>"; }).join("") + "</select></label>";
      return '<label class="f">' + lab + '<input type="text" name="q_' + E(q.id) + '" maxlength="160"' + (q.required ? " required" : "") + (q.hint ? ' placeholder="' + E(q.hint) + '"' : "") + "></label>";
    }).join("");
  }
  function whatLine() {       // 'Table for 4', or 'Beginner lessons · 1 hr · £36 · with Salman'
    var s = pick.service;
    if (isT()) return "<b>Table for " + pick.party + "</b>";
    return "<b>" + E(s.name) + "</b> · " + len(s.minutes) + (price(s.price) ? " · " + E(price(s.price)) : "") + (pick.staff && pick.staff !== "any" && staffName(pick.staff) ? " · with " + E(staffName(pick.staff)) : "");
  }

  function summary() {
    var s = pick.service;
    return '<div class="sumcard"><h2>Your booking</h2><dl>' +
      "<dt>What</dt>" + (s ? "<dd>" + whatLine().replace(/<\/?b>/g, "") + "</dd>" : '<dd class="no">Not chosen yet</dd>') +
      "<dt>When</dt>" + (pick.start != null ? "<dd>" + niceDate(pick.date) + " at " + niceTime(pick.start) + "</dd>" : '<dd class="no">Not chosen yet</dd>') +
      (biz.address ? "<dt>Where</dt><dd>" + E(biz.address) + "</dd>" : "") + "</dl>" +
      (biz.phone ? '<p class="help">Questions? Call <a href="tel:' + E(biz.phone.replace(/[^\d+]/g, "")) + '">' + E(biz.phone) + "</a></p>" : "") + "</div>";
  }

  // the week strip: 7 days from `from`; jumps forward to the first day with times the first time round
  function loadWeek(from, hunting) {
    BWAPI.call("slots", { b: slug, service: pick.service.id, party: pick.party || "", staff: pick.staff || "any", from: from || "", days: 7 }).then(function (r) {
      if (!r.ok) { $("#picker").innerHTML = '<div class="err">' + E(r.error) + "</div>"; return; }
      lastDay = r.last; todayUK = r.today;
      var days = r.days, first = days.filter(function (d) { return d.times.length; })[0];
      if (!first && (hunting || 0) < 4 && days[6].date < r.last && week == null) return loadWeek(add(days[0].date, 7), (hunting || 0) + 1);
      week = days[0].date;
      if (!pick.date || !days.some(function (d) { return d.date === pick.date; })) pick.date = first ? first.date : null;
      drawWeek(days);
    });
  }

  function drawWeek(days) {
    var startDay = days[0].date, el = $("#picker"); if (!el) return;
    var sel = days.filter(function (d) { return d.date === pick.date; })[0];
    var m1 = MN[new Date(ms(startDay)).getUTCMonth()], m2 = MN[new Date(ms(days[6].date)).getUTCMonth()];
    var h = '<p class="month">' + (m1 === m2 ? m1 : m1 + " / " + m2) + "</p>" +
      '<div class="week"><button type="button" class="nav" id="prev" aria-label="Earlier days">‹</button><div class="days">' +
      days.map(function (d) {
        var n = d.times.length;
        return '<button type="button" class="day' + (n ? "" : " none") + (d.date === pick.date ? " on" : "") + '" data-day="' + d.date + '"' + (n ? "" : " disabled") +
          ' aria-label="' + niceDate(d.date) + (n ? "" : ", fully booked or closed") + '"><small>' + DN[wd(d.date)] + "</small><b>" + +d.date.slice(8) + "</b></button>";
      }).join("") + '</div><button type="button" class="nav" id="next" aria-label="Later days">›</button></div>';
    if (sel && sel.times.length) h += '<div class="times">' + sel.times.map(function (t) { return '<button type="button" class="time" data-t="' + t + '">' + niceTime(t) + "</button>"; }).join("") + "</div>";
    else h += '<p class="muted">No free times this week. Try the next week' + (biz.phone ? ', or call <a href="tel:' + E(biz.phone.replace(/[^\d+]/g, "")) + '">' + E(biz.phone) + "</a>" : "") + ".</p>";
    el.innerHTML = h;
    $("#prev").disabled = !!todayUK && startDay <= todayUK;
    $("#next").disabled = !!lastDay && days[6].date >= lastDay;
    $("#prev").onclick = function () { pick.date = null; loadWeek(add(startDay, -7)); week = add(startDay, -7); };
    $("#next").onclick = function () { pick.date = null; loadWeek(add(startDay, 7)); week = add(startDay, 7); };
    if (pendingGo) { var g = pendingGo; pendingGo = null; goTo(g); }    // the free times are on the page now: bring them into view
    el.querySelectorAll("[data-day]").forEach(function (b) { b.onclick = function () { pick.date = b.dataset.day; drawWeek(days); showTimes(); }; });
    el.querySelectorAll("[data-t]").forEach(function (b) { b.onclick = function () { pick.start = +b.dataset.t; render(); goTo("#step3"); }; });
  }

  function submit(e) {
    e.preventDefault();
    if (busy) return;
    var f = e.target, v = function (n) { return f.elements[n].value.trim(); };
    var err = !v("name") ? "Please add your name." : !/\d{5}/.test(v("phone").replace(/\D/g, "")) ? "Please add a phone number we can reach you on." : !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v("email")) ? "Please check your email address." : "";
    var answers = {};
    (biz.questions || []).forEach(function (q) { var el = f.elements["q_" + q.id]; answers[q.id] = el ? el.value.trim() : ""; if (!err && q.required && !answers[q.id]) err = "Please answer: " + q.label; });
    if (err) { $("#ferr").innerHTML = '<div class="err">' + E(err) + "</div>"; return; }
    busy = true; var btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = ask() ? "Sending…" : "Booking…";
    BWAPI.call("book", { b: slug, service: pick.service.id, party: pick.party || "", date: pick.date, start: pick.start, name: v("name"), phone: v("phone"), email: v("email"), note: v("note"), answers: answers, staff: pick.staff || "any", repeat: f.elements.repeat ? +f.elements.repeat.value : 1, website: f.elements.website.value })
      .then(function (r) {
        busy = false;
        if (!r.ok) {
          if (r.weeks) { $("#ferr").innerHTML = '<div class="err">' + E(r.error) + "</div>"; btn.disabled = false; btn.textContent = ask() ? "Send request" : "Confirm booking"; return; }
          if (r.taken) { pick.start = null; render(); goTo("#step2"); setTimeout(function () { var p = $("#picker"); if (p) p.insertAdjacentHTML("beforebegin", '<div class="err">' + E(r.error) + "</div>"); }, 0); return; }
          $("#ferr").innerHTML = '<div class="err">' + E(r.error) + "</div>"; btn.disabled = false; btn.textContent = ask() ? "Send request" : "Confirm booking"; return;
        }
        doneView(r.booking, r.emailed, v("email"));
      });
  }

  function label(x) { return x.party ? "Table for " + x.party : x.service; }

  function calLink(x) {
    var d = x.date.replace(/-/g, ""), t = function (m) { m = Math.min(m, 1439); return (m < 600 ? "0" : "") + Math.floor(m / 60) + ((m % 60) < 10 ? "0" : "") + (m % 60) + "00"; };
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(label(x) + " at " + biz.name) + "&dates=" + d + "T" + t(x.start) + "/" + d + "T" + t(x.start + x.minutes) + "&ctz=Europe/London" + (biz.address ? "&location=" + encodeURIComponent(biz.address) : "");
  }

  function doneView(x, emailed, email) {
    var req = x.status === "requested";
    $("#main").innerHTML = '<div class="done-box"><div class="tick">✓</div><h1>' + (req ? "Request sent" : "You\'re booked in") + "</h1>" +
      (req ? "<p>" + E(biz.name) + " will check it and email you to confirm. The time is held for you until then.</p>" : "") +
      '<div class="summary"><b>' + E(label(x)) + "</b>" + (x.staff_name ? " with " + E(x.staff_name) : "") + "<br>" + niceDate(x.date) + " at " + niceTime(x.start) + (x.party ? "" : " (" + len(x.minutes) + ")") +
      ((x.dates || []).length > 1 ? "<br><br>Every week, " + x.dates.length + " times:<br>" + x.dates.map(niceDate).join("<br>") : "") + (biz.address ? "<br>" + E(biz.address) : "") + "</div>" +
      (emailed ? "<p>We've sent " + (req ? "a copy of your request" : "a confirmation") + " to <b>" + E(email) + "</b>, with a link to cancel if you need to.</p>" : "<p>Your " + (req ? "request" : "booking") + " is saved. We couldn't send the email, so please keep a note of it.</p>") +
      (biz.settings.note ? '<p class="note">' + E(biz.settings.note) + "</p>" : "") +
      (req ? "" : '<p><a class="btn line" href="' + E(calLink(x)) + '" target="_blank" rel="noopener">Add to my calendar</a></p>') + "</div>";
    goTo(".done-box");
  }

  function cancelView(id, t) {
    BWAPI.call("lookup", { b: slug, id: id, t: t }).then(function (r) {
      if (!r.ok) return fail(r.error);
      var x = r.booking, line = '<div class="summary"><b>' + E(label(x)) + "</b><br>" + niceDate(x.date) + " at " + niceTime(x.start) + "</div>";
      var gone = x.status === "cancelled" || x.status === "declined";
      var h = '<div class="intro"><h1>' + (x.status === "cancelled" ? "This booking is cancelled" : x.status === "declined" ? "This time wasn't available" : x.status === "requested" ? "Your request" : "Your booking") + "</h1>" +
        (x.status === "requested" ? '<p class="muted">Waiting for ' + E(biz.name) + " to confirm.</p>" : "") + "</div>" + line;
      if (gone) h += '<p><a class="btn" href="?b=' + encodeURIComponent(slug) + '">Book another time</a></p>';
      else if (r.can_cancel) h += '<p>Need to cancel, ' + E(x.name) + '?</p><div id="cerr"></div><button class="btn danger" id="cx" type="button">Cancel this booking</button>' +
        (x.weeks_left > 1 ? ' <button class="btn line" id="cxall" type="button">Cancel this and the ' + (x.weeks_left - 1) + " after it</button>" : "");
      else h += "<p>It's too close to the time to cancel online." + (biz.phone ? ' Please call <a href="tel:' + E(biz.phone.replace(/[^\d+]/g, "")) + '">' + E(biz.phone) + "</a>." : " Please get in touch directly.") + "</p>";
      $("#main").innerHTML = h;
      var doCancel = function (b, all) {
        b.disabled = true; b.textContent = "Cancelling…";
        BWAPI.call("cancel", { b: slug, id: id, t: t, series: !!all }).then(function (c) {
          if (!c.ok) { $("#cerr").innerHTML = '<div class="err">' + E(c.error) + "</div>"; b.disabled = false; b.textContent = "Cancel this booking"; return; }
          $("#main").innerHTML = '<div class="intro"><h1>Cancelled</h1></div>' + line + "<p>" + (all ? "Your weekly bookings from this date are cancelled" : "Your booking is cancelled") + " and we've let " + E(biz.name) + ' know.</p><p><a class="btn" href="?b=' + encodeURIComponent(slug) + '">Book another time</a></p>';
        });
      };
      if ($("#cx")) $("#cx").onclick = function () { doCancel(this, false); };
      if ($("#cxall")) $("#cxall").onclick = function () { doCancel(this, true); };
    });
  }
})();
</script>
</body>
</html>
